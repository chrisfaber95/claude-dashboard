<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Dashboard</title>
  <link rel="stylesheet" href="./style.scss">
  <script src="/boot.js"></script>
</head>
<body>
  <header class="top">
    <h1>Claude Dashboard</h1>
    <div class="top__meta">
      <span id="alert-badge" class="alert-badge-slot"></span>
      <span id="conn" class="conn">connecting…</span>
      <select id="skin" aria-label="Skin">
        <option value="classic">Classic</option>
        <option value="copilot">Co-pilot</option>
        <option value="root">Root</option>
      </select>
      <button id="theme" class="btn" type="button" aria-label="Toggle theme">Theme</button>
      <form id="logout" method="post" action="/logout" hidden><button class="btn" type="submit">Log out</button></form>
    </div>
  </header>
  <main>
    <div id="render-warn" class="notice" role="status" hidden>Some sections failed to render. The next update may fix it.</div>
    <section id="core" class="core" aria-labelledby="h-core"></section>
    <nav id="popup-bar" class="popup-bar" aria-label="Open a panel"></nav>
    <section id="limits" class="panel" aria-labelledby="h-limits"></section>
    <div id="alerts"></div>
    <section id="sessions" class="panel" aria-labelledby="h-sessions"></section>
  </main>
  <div id="popups" class="popups" hidden>
    <div id="popup-projects" class="popup" role="dialog" aria-modal="true" aria-label="Projects" hidden>
      <button class="btn popup__close" type="button" data-popup-close aria-label="Close Projects">Close</button>
      <section id="projects" class="panel" aria-labelledby="h-projects"></section>
    </div>
    <div id="popup-comms" class="popup" role="dialog" aria-modal="true" aria-label="Session messages" hidden>
      <button class="btn popup__close" type="button" data-popup-close aria-label="Close Session messages">Close</button>
      <section id="comms" class="panel" aria-labelledby="h-comms"></section>
    </div>
    <div id="popup-team" class="popup" role="dialog" aria-modal="true" aria-label="Team board" hidden>
      <button class="btn popup__close" type="button" data-popup-close aria-label="Close Team board">Close</button>
      <section id="team" class="panel team" aria-labelledby="h-team"></section>
    </div>
    <div id="popup-usage" class="popup" role="dialog" aria-modal="true" aria-label="Token usage" hidden>
      <button class="btn popup__close" type="button" data-popup-close aria-label="Close Token usage">Close</button>
      <section id="usage" class="panel" aria-labelledby="h-usage"></section>
    </div>
    <div id="popup-chat" class="popup" role="dialog" aria-modal="true" aria-label="Chat" hidden>
      <button class="btn popup__close" type="button" data-popup-close aria-label="Close Chat">Close</button>
      <section id="chat" class="panel chat" aria-labelledby="h-chat">
        <div id="chat-panel"></div>
        <div class="chat__setting">
          <label>Session summaries
            <select id="summary-mode">
              <option value="recap">Recap (no model)</option>
              <option value="model">Model (haiku, one CLI call)</option>
            </select>
          </label>
          <span id="summary-status" class="sub" role="status"></span>
          <span id="summary-note" class="sub" hidden>Commands are off, so summaries use the recap.</span>
        </div>
      </section>
    </div>
    <div id="popup-run" class="popup" role="dialog" aria-modal="true" aria-label="Launch a task" hidden>
      <button class="btn popup__close" type="button" data-popup-close aria-label="Close Launch a task">Close</button>
      <section id="run" class="panel" aria-labelledby="h-run" hidden></section>
    </div>
    <div id="popup-devices" class="popup" role="dialog" aria-modal="true" aria-label="Devices" hidden>
      <button class="btn popup__close" type="button" data-popup-close aria-label="Close Devices">Close</button>
      <section id="devices" class="panel devices" aria-labelledby="h-devices"></section>
    </div>
    <div id="popup-audit" class="popup" role="dialog" aria-modal="true" aria-label="Activity" hidden>
      <button class="btn popup__close" type="button" data-popup-close aria-label="Close Activity">Close</button>
      <section id="audit" class="panel audit" aria-labelledby="h-audit"></section>
    </div>
    <div id="popup-approvals" class="popup" role="dialog" aria-modal="true" aria-label="Approvals" hidden>
      <button class="btn popup__close" type="button" data-popup-close aria-label="Close Approvals">Close</button>
      <section id="approvals" class="panel approvals" aria-labelledby="h-approvals" hidden>
        <h2 id="h-approvals">Approvals</h2>
        <div class="approvals__bar">
          <button id="approvals-refresh" class="btn btn--sm" type="button">Refresh</button>
          <span id="approvals-status" class="sub" role="status"></span>
        </div>
        <ul id="approvals-list" class="approvals__list"></ul>
      </section>
    </div>
  </div>
  <div id="building-dialog"></div>
  <div id="transcript-drawer"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="tip-root"></div>
  <script type="module" src="./app/app.ts"></script>
</body>
</html>
