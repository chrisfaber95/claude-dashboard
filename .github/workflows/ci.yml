name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      # Tests guard main only; PRs into an epic/* branch run typecheck and lint (decision 0008).
      - if: github.event_name == 'push' || github.base_ref == 'main'
        run: npm test
