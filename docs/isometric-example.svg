<!-- Reference picture for docs/isometric.md, generated with the helpers in that guide. Light-theme token values
     are hard-coded here; in the app use the classes and tokens the guide names. -->
<!-- The postman walks once when the picture opens; reload to see it again. -->
<style>
.iso__grass{fill:#e6ecdc;stroke:#d3dbc6;stroke-width:1}
.iso__street{fill:#d9d7d0;stroke:#c9c6be;stroke-width:1}
.iso-tint-1{color:#2a78d6}.iso-tint-2{color:#eb6834}.iso-tint-3{color:#1baf7a}.iso-tint-5{color:#e87ba4}.iso-tint-7{color:#4a3aa7}
.iso__face--top{fill:color-mix(in srgb,currentColor 55%,#fff)}
.iso__face--left{fill:currentColor}
.iso__face--right{fill:color-mix(in srgb,currentColor 68%,#000)}
.iso__face--top,.iso__face--left,.iso__face--right{stroke:color-mix(in srgb,currentColor 40%,#000);stroke-width:1;stroke-linejoin:round}
.iso__window{fill:#fdf3b0}
.iso__door{fill:#3a3936}
.iso__awning{fill:#fcfcfb;opacity:.9}
.is-idle .iso__window{fill:#52514e}
.is-stopped .iso__face--top,.is-stopped .iso__face--left,.is-stopped .iso__face--right{fill:#c9c7c0;stroke:#898781}
.is-stopped .iso__window,.is-stopped .iso__awning{fill:#898781}
.iso__label{font:600 11px system-ui,sans-serif;fill:#0b0b0b;text-anchor:middle;paint-order:stroke;stroke:#fcfcfb;stroke-width:3px}
.iso__status{font:10px system-ui,sans-serif;fill:#52514e;text-anchor:middle;paint-order:stroke;stroke:#fcfcfb;stroke-width:3px}
.iso__walker circle{fill:#0b0b0b;stroke:#fcfcfb}
.iso__walker rect{fill:#fcfcfb}
.iso__walker-shadow{fill:#0b0b0b;opacity:.2}
.iso__step{opacity:0;animation:iso-step 0.9s linear var(--step-delay)}
@keyframes iso-step{from{opacity:1;transform:translate(var(--from-x),var(--from-y))}to{opacity:1;transform:translate(var(--to-x),var(--to-y))}}</style>
